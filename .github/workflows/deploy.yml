name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/telegram-whatsapp-bridge
            git pull origin main
            docker-compose down
            sudo rm -rf data/wwebjs_auth
            docker build -t tg-wa-bridge .
            docker-compose up -d
            docker image prune -f
